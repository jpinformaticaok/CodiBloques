appId: ok.jpinformaticaok.codibloques
productName: CodiBloques
copyright: Copyright © 2026 Juan Pablo Aguero (https://github.com/jpinformaticaok)
directories:
  output: dist
  buildResources: build
files:
  - desktop/main.cjs
  - package.json
extraResources:
  - from: gui
    to: scratch-gui
    filter:
      - "**/*"
  - from: extensions
    to: extensions
    filter:
      - "**/*"
asar: true
win:
  # Nota: signAndEditExecutable NO se desactiva. Esa opcion bloquea tambien
  # rcedit, que es el que aplica el icono y los datos de version al .exe
  # (sin ella el ejecutable se queda con el icono y "ProductName: Electron").
  # La firma igual se omite sola porque no hay certificado configurado
  # ("no signing info identified, signing is skipped").
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
  artifactName: CodiBloques-Portable-${version}.exe
portable:
  artifactName: CodiBloques-Portable-${version}.exe
  requestExecutionLevel: user
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: CodiBloques
